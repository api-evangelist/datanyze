description: 'Datanyze is a sales intelligence and technographic data provider owned by ZoomInfo. It
  offers a free browser (Chrome) extension that surfaces business contact information — work email
  addresses, direct-dial and mobile phone numbers, and company firmographics — for prospects on
  LinkedIn profiles and company websites. Datanyze pioneered "technographics," the practice of tracking
  the web technologies and software a company uses to power targeted B2B sales and marketing outreach.
  ZoomInfo acquired Datanyze in 2018 to deliver real-time technographic data to its customers. No public
  developer API is currently documented; this profile captures the company''s discoverable web and
  security surface.'
